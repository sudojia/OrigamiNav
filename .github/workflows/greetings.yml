name: Greetings

# 给第一次提交 Issue / PR 的用户发欢迎留言。
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    name: Welcome first-time contributors
    runs-on: ubuntu-latest
    steps:
      - name: Greet
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 感谢提交你的第一个 Issue！

            为了让问题更快被定位，请确认已按模板填写了**复现步骤**和**运行环境**（注意脱敏，不要泄露 `DATABASE_URL` 或密码）。

            - 📖 部署与环境变量说明见 [README](https://github.com/sudojia/OrigamiNav#readme)
            - 💬 使用交流请到 [Discussions](https://github.com/sudojia/OrigamiNav/discussions)
          pr-message: |
            🎉 感谢你的第一个 Pull Request！

            - 请确认已阅读 [CONTRIBUTING.md](https://github.com/sudojia/OrigamiNav/blob/master/.github/CONTRIBUTING.md)
            - CI 会自动运行 Lint、Typecheck、双环境构建（有/无数据库）与迁移校验，全绿后等待 review 即可

            再次感谢对 OrigamiNav 的支持！⭐

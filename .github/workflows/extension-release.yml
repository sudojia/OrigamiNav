name: Extension Release

# Manual workflow_dispatch → upload zips as artifacts for testing

on:
  workflow_dispatch:
  push:
    tags:
      - 'ext-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      - name: Typecheck
        working-directory: extension
        run: npm run typecheck

      - name: Build & zip Chrome extension
        working-directory: extension
        run: npm run zip

      - name: Build & zip Firefox extension
        working-directory: extension
        run: npm run zip:firefox

      - name: Upload artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: extension/.output/*.zip
          if-no-files-found: error

      - name: Attach zips to GitHub Release
        if: startsWith(github.ref, 'refs/tags/ext-v')
        uses: softprops/action-gh-release@v2
        with:
          files: extension/.output/*.zip
          generate_release_notes: true

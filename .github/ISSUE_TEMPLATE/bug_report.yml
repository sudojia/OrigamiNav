name: 🐛 Bug 报告
description: 报告 OrigamiNav 的问题，帮助我们把项目做得更好
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整，信息越具体，问题越容易被定位和修复。

  - type: textarea
    id: description
    attributes:
      label: 📋 问题描述
      description: 简明扼要地描述遇到了什么问题。
      placeholder: 例如：导入浏览器书签 HTML 后，部分书签的图标显示异常
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 🔁 复现步骤
      description: 其他人照着做也能遇到同样问题的完整步骤。
      placeholder: |
        1. 打开「…」页面
        2. 点击「…」
        3. 出现错误：…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ 期望行为
      description: 你认为正确的结果应该是什么？

  - type: textarea
    id: actual
    attributes:
      label: ❌ 实际行为
      description: 实际发生了什么？如有报错 / 截图 / 录屏请一并贴出（注意脱敏）。

  - type: dropdown
    id: deploy
    attributes:
      label: 🚀 部署方式
      options:
        - Releases 下载的 standalone 构建包
        - 从源码运行（git clone / npm）
        - 从源码构建（npm run build）
        - 其他 / 不确定
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 🏷️ OrigamiNav 版本
      description: 构建包的版本号或提交的 commit，例如 v0.1.0
      placeholder: v0.1.0

  - type: textarea
    id: environment
    attributes:
      label: 🖥️ 运行环境
      description: Node 版本、Postgres 类型（自建 / Supabase / Neon…）、操作系统、浏览器等。
      placeholder: |
        - Node: v22.x
        - 数据库: 自建 PostgreSQL 16
        - 系统: Debian 12 / Docker
        - 浏览器: Chrome 最新版
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 📜 相关日志
      description: 服务端控制台输出、浏览器控制台报错等（**请务必脱敏，不要泄露 DATABASE_URL 或密码**）。
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: ✔️ 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认这不是重复问题
          required: true
        - label: 我已尝试更新到最新版本，问题仍然存在
          required: true

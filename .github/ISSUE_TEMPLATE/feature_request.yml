name: 💡 功能建议
description: 为 OrigamiNav 提出新功能或改进建议
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出想法！描述清楚「想解决什么问题」比「想要什么功能」更重要。

  - type: textarea
    id: problem
    attributes:
      label: 🎯 要解决的问题
      description: 你遇到了什么不便？或希望达成什么效果？
      placeholder: 例如：书签多了以后，我想按使用频率排序，目前只能手动拖拽
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 💭 期望的方案
      description: 你设想的实现方式或交互是什么样的？

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 考虑过的替代方案
      description: 其他可行的方式，或你目前是怎么绕过这个问题的。

  - type: textarea
    id: context
    attributes:
      label: 📎 补充信息
      description: 截图、参考的其他产品、相关链接等（注意脱敏）。

  - type: checkboxes
    id: checklist
    attributes:
      label: ✔️ 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认这不是重复建议
          required: true
